apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-log-analyzer
  labels:
    app: llm-log-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-log-analyzer
  template:
    metadata:
      labels:
        app: llm-log-analyzer
    spec:
      containers:
        - name: llm-log-analyzer
          image: mohitsalvi/k8s-llm-error-logs:0.2
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: llm-log-analyzer-service
spec:
  selector:
    app: llm-log-analyzer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: NodePort
