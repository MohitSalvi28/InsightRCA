
---
 apiVersion: v1
 kind: ConfigMap
 metadata:
  name: logstash-config
  namespace: llm-rca
 data:
  logstash.conf: |
    input {
      beats {
        port => 5044
      }
    }

    filter {
      if [message] =~ /^\{.*\}$/ {
        json {
          source => "message"
          target => "parsed_json"
          skip_on_invalid_json => true
        }
        if [parsed_json][level] {
          mutate { add_field => { "log_level" => "%{[parsed_json][level]}" } }
        }
        if [parsed_json][msg] {
          mutate { replace => { "message" => "%{[parsed_json][msg]}" } }
        }
      }

      if ![log_level] {
        grok {
          match => { "message" => "(?i)(?<log_level>error|warn|warning|fatal|panic|exception)" }
        }
      }

      if ![log_level] or [log_level] !~ /(?i)(error|warn|warning|fatal|panic|exception)/ {
        drop { }
      }

      fingerprint {
        source => "message"
        target => "[@metadata][fingerprint]"
        method => "SHA256"
        key => "llm-dedupe-key"
      }
      aggregate {
        task_id => "%{[@metadata][fingerprint]}"
        code => "map['seen'] ||= true"
        map_action => "create"
        timeout => 600
      }
      if [@metadata][duplicate] {
        drop { }
      }

      mutate {
        add_field => {
          "rca_context"   => "Pod: %{[kubernetes][pod][name]}, Namespace: %{[kubernetes][namespace]}, Container: %{[kubernetes][container][name]}"
          "rca_timestamp" => "%{@timestamp}"
        }
      }

      mutate {
        gsub => [
          "message", "\n", " ",
          "message", "\r", " ",
          "message", "\t", " "
        ]
      }
    }

    output {
      http {
        url => "http://llm-log-analyzer-service.default.svc.cluster.local:80/generate"
        http_method => "post"
        format => "json"
        content_type => "application/json"
        socket_timeout => 600
        request_timeout => 600
        automatic_retries => 3
        mapping => {
          "prompt" => "Analyze this Kubernetes error: %{message}. Context: %{rca_context}. Timestamp: %{rca_timestamp}."
        }
      }

      stdout { codec => json_lines }

      file {
        path => "/usr/share/logstash/logs/rca_analysis.json"
        codec => json_lines
        flush_interval => 1
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: llm-rca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
      - name: fix-permissions
        image: alpine:3.18
        command:
          - sh
          - -c
          - |
            echo ">> Creating log directory and fixing permissions"
            mkdir -p /usr/share/logstash/logs
            chown -R 1000:1000 /usr/share/logstash/logs
            chmod -R 755 /usr/share/logstash/logs
            ls -ld /usr/share/logstash/logs
        volumeMounts:
          - name: logstash-logs
            mountPath: /usr/share/logstash/logs
      containers:
      - name: logstash
        image: docker.elastic.co/logstash/logstash:7.17.9
        ports:
          - containerPort: 5044
          - containerPort: 9600
        env:
          - name: XPACK_MONITORING_ENABLED
            value: "false"
          - name: LS_JAVA_OPTS
            value: "-Xmx512m -Xms256m"
          - name: LS_HTTP_ENABLED
            value: "true"
        resources:
          limits:
            memory: 1Gi
            cpu: 500m
          requests:
            memory: 512Mi
            cpu: 250m
        volumeMounts:
          - name: pipeline
            mountPath: /usr/share/logstash/pipeline/logstash.conf
            subPath: logstash.conf
          - name: logstash-logs
            mountPath: /usr/share/logstash/logs
        readinessProbe:
          httpGet:
            path: /
            port: 9600
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 9600
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
        - name: pipeline
          configMap:
            name: logstash-config
        - name: logstash-logs
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: llm-rca
spec:
  selector:
    app: logstash
  ports:
    - name: beats
      port: 5044
      targetPort: 5044
    - name: api
      port: 9600
      targetPort: 9600
